; MegaPanel - ESP32-S3 HUB75 matrix application
;
; Primary target: ESP32-S3 with PSRAM, Arduino framework.
; The HAL keeps the panel driver replaceable; this environment uses the
; ESP32-HUB75-MatrixPanel-I2S-DMA reference backend.
;
; Build:
;   pio run
;   pio run -t upload
;   pio run -t uploadfs
;
; If your board uses QSPI PSRAM instead of OPI PSRAM, change
; board_build.arduino.memory_type to qio_qspi.

[platformio]
default_envs = esp32s3
src_dir = src
data_dir = data

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git
  tzapu/WiFiManager@^2.0.17

build_flags =
  -DPANEL_USE_HUB75=1
  -DGFX_LAYER_PSRAM=1
  -DGFX_LITE_MAX_LAYER_MEMORY=4194304UL
  -DNO_GFX=1
  -DCORE_DEBUG_LEVEL=3
  -DPANEL_FW_NAME=\"MegaPanel\"
  -DPANEL_FW_VERSION=\"0.1.0\"

; Optional full build with world clock, Canvas JSON, Lua and fx3d in later phases.
[env:esp32s3_full]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DPANEL_ENABLE_LUA=1
  -DPANEL_ENABLE_FX3D=1
  -DPANEL_ENABLE_DATA_SOURCES=1

; Debug build with more serial output. Use the same partitions.
[env:esp32s3_debug]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -DPANEL_DEBUG=1
